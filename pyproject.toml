[project]
name = "epiframe"
version = "2.0.0a2"
description = "Photo frame for Raspberry Pi with e-Paper and HDMI displays"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "MikeGawi" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "flask>=3.1",
    "flask-login>=0.6.3",
    "flask-wtf>=1.2",
    "pillow>=11",
    "pytelegrambotapi>=4.30",
    "requests>=2.32",
    "werkzeug>=3.1",
    "wtforms>=3.3",
    # Direct dependency only so that ARM gets it from piwheels (needed by the Pimoroni inky library).
    "numpy>=1.26",
    # SPI access for e-Paper displays, only needed (and buildable) on the Raspberry Pi.
    "spidev>=3.6; platform_machine == 'armv6l' or platform_machine == 'armv7l' or platform_machine == 'aarch64'",
]

[project.urls]
Homepage = "https://github.com/MikeGawi/ePiframe"
Issues = "https://github.com/MikeGawi/ePiframe/issues"

[dependency-groups]
test = [
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-mock>=3.14",
    "requests-mock>=1.12",
]
dev = [
    { include-group = "test" },
    "genbadge[coverage,tests]>=1.1.3",
    "mypy>=2",
    "pre-commit>=4",
    "radon>=6",
    "ruff>=0.17",
    "types-requests",
    "xenon>=0.9.3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------- uv
[tool.uv]
default-groups = ["dev"]

# piwheels hosts prebuilt ARMv6/ARMv7 wheels for Raspberry Pi OS. It is used only for the
# packages with C extensions, and only on ARM, so x86 machines (dev, CI) keep using PyPI.
[[tool.uv.index]]
name = "piwheels"
url = "https://www.piwheels.org/simple"
explicit = true

[tool.uv.sources]
numpy = { index = "piwheels", marker = "platform_machine == 'armv6l' or platform_machine == 'armv7l'" }
pillow = { index = "piwheels", marker = "platform_machine == 'armv6l' or platform_machine == 'armv7l'" }
spidev = { index = "piwheels", marker = "platform_machine == 'armv6l' or platform_machine == 'armv7l'" }

# -------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["lib", "venv", "static", "templates"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90", "UP", "B", "SIM", "PL", "RUF", "PT", "S"]
ignore = [
    "PLR2004", # magic values in comparisons
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
# SQL is composed only from module constants; all values are bound parameters
"src/epiframe/photos/index.py" = ["S608"]
"tests/**" = ["S101", "PLR0913", "PLR0915"]
# smoke tests start ePiframe processes with fixed arguments
"tests/smoke/**" = ["S603"]
# 1.x code: only basic checks until each module is ported to src/epiframe (Phase 3).
"{ePiframe,ePiframe_service}.py" = ["UP", "B", "SIM", "PL", "RUF", "S", "I", "E501"]
"{misc,modules,tools,plugins}/**" = ["UP", "B", "SIM", "PL", "RUF", "S", "I", "E501"]
"tests/{test_*,conftest}.py" = ["UP", "B", "SIM", "PL", "RUF", "S", "I", "PT", "E501"]
"tests/{helpers,plugins}/**" = ["UP", "B", "SIM", "PL", "RUF", "S", "I", "PT", "E501"]

# -------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src/epiframe", "scripts", "tests/epiframe", "tests/scripts", "tests/smoke"]
strict = true
warn_unreachable = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["genbadge.*", "radon.*"]
ignore_missing_imports = true

# 1.x code imported by ported modules (e.g. epiframe.config.manager) until it is
# ported too: not type checked, its names are Any.
[[tool.mypy.overrides]]
module = ["modules.*", "misc.*", "ePiframe", "ePiframe_service"]
follow_imports = "skip"

# ------------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# smoke tests (tests/smoke) run the real entry points; CI runs them separately:
# uv run pytest -m smoke
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not smoke"]
markers = ["smoke: end-to-end smoke tests (ePiframe processes, ImageMagick, WebUI)"]

[tool.coverage.run]
branch = true
source = ["src/epiframe", "scripts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.coverage.xml]
output = "coverage.xml"

# ------------------------------------------------------------------------ codespell
[tool.codespell]
skip = "./static/js,config_v1.cfg,./lib,./venv,./.venv,*.svg,*.gif,*.png,*.jpg,uv.lock"
ignore-words-list = "exten,valu"
