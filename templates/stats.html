{% extends "layout.html" %}
{% block title %}Statistics{% endblock %}
{% block head %}
  {{ super() }}
{% endblock %}
{% block content %}
	<div class="col-auto flex-fill px-0 py-2 align-items-center overflow-auto">
		<div class="row align-middle mx-2 px-0 py-2">
			<div class="col-auto">
				Data:
			</div>
			<div class="col-auto flex-fill px-1">
				<select class="form-select form-select-sm" onInput='act()' id='dropdown'>
				{% for name, metrics in groups.items() %}
					<option value="{{ metrics|join(',') }}"{% if loop.first %} selected{% endif %}>{{ name }}</option>
				{% endfor %}
				</select>
			</div>
			<div class="col-auto px-1">
				<select class="form-select form-select-sm" onInput='act()' id='period'>
				{% for period in periods %}
					<option value="{{ period }}"{% if loop.first %} selected{% endif %}>{{ period|capitalize }}</option>
				{% endfor %}
				</select>
			</div>
		</div>
		<div class="row align-middle mx-2 px-0 py-2">
			<div class="col col-auto flex-fill"></div>
			<div id="graph" class="col col-auto" style="font-size:10px;width:600px;height:300px"></div>
			<div class="col col-auto flex-fill"></div>
		</div>
		<div class="row align-middle mx-2 px-0 py-2">
			<div class="col col-auto flex-fill"></div>
			<div id="legend" class="col col-auto"></div>
			<div class="col col-auto flex-fill"></div>
		</div>
		<img class="row mx-auto" id="load-img" src="{{ url_for('static', filename='loader.gif') }}" />
	</div>

    <script type="text/javascript" src="{{ url_for('static', filename='js/flot/jquery.flot.min.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='js/flot/jquery.flot.tooltip.min.js') }}"></script>
	<script>
		var colors = ["#FBD148", "#F9975D", "#C85C5C", "#5584AC"];

		// Flot 0.7 shows time axes in UTC: shift the times to the browser's zone
		function local(seconds) {
			var milliseconds = seconds * 1000;
			return milliseconds - new Date(milliseconds).getTimezoneOffset() * 60000;
		}

		function draw(data) {
			var lines = data.metrics.map(function(metric, index) {
				var unit = metric.unit ? " [" + metric.unit + "]" : "";
				return {
					label: metric.label + unit,
					color: colors[index % colors.length],
					data: metric.values.map(function(value, point) {
						return [local(data.time[point]), value];
					})
				};
			});
			$.plot($("#graph"), lines, {
				xaxis: {mode: "time", timeformat: data.period == "day" ? "%H:%M" : "%d.%m"},
				grid: {hoverable: true},
				legend: {container: $("#legend")},
				tooltip: true,
				tooltipOpts: {content: "<b>%s</b><br/>%y.2"}
			});
			$('#load-img').hide();
		}

		function act() {
			$('#load-img').show();
			$("#graph").html("");
			$.getJSON("{{ url_for('get_stats') }}", {
				metrics: $("#dropdown").val(),
				period: $("#period").val()
			}, draw);
		}

		act();
		$(".stats-menu").addClass("link-light");
	</script>
{% endblock %}
