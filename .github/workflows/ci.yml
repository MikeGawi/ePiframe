name: CI

on:
  pull_request:
    branches: [v2, master]
  push:
    branches: [v2, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: pre-commit (ruff, mypy, xenon, shellcheck, codespell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Raspberry Pi OS Bookworm, 3.13 = Trixie
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: pytest with branch coverage
        run: >-
          uv run --frozen pytest --cov --cov-report=xml --cov-report=term
          --junitxml=junit.xml
      - name: Upload reports (for badges)
        if: ${{ !cancelled() && matrix.python == '3.11' }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            junit.xml
            coverage.xml

  badges:
    name: Publish badges
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          name: reports
      - run: uv run --frozen python scripts/badges.py --junit junit.xml --coverage coverage.xml --out badges
      - name: Push badges to the "badges" branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --depth=1 origin badges
            git worktree add --detach badges-branch FETCH_HEAD
          else
            git worktree add --detach badges-branch
            git -C badges-branch checkout --orphan badges
            git -C badges-branch rm -rfq --ignore-unmatch .
          fi
          mkdir -p "badges-branch/$BRANCH"
          cp badges/*.svg "badges-branch/$BRANCH/"
          cd badges-branch
          git add -A
          if git diff --cached --quiet; then
            echo "Badges unchanged"
          else
            git commit -m "Update $BRANCH badges (${GITHUB_SHA::7})"
            git push origin HEAD:badges
          fi
