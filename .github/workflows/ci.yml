name: CI

on:
  pull_request:
    branches: [v2, master]
  push:
    branches: [v2, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: pre-commit (ruff, mypy, xenon, shellcheck, codespell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Raspberry Pi OS Bookworm, 3.13 = Trixie
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: pytest with branch coverage
        run: >-
          uv run --frozen pytest --cov --cov-report=xml --cov-report=term
          --junitxml=junit.xml
      - name: Upload reports (for badges)
        if: ${{ !cancelled() && matrix.python == '3.11' }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            junit.xml
            coverage.xml

  smoke:
    name: smoke tests (ePiframe processes, ImageMagick, WebUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Raspberry Pi OS Bookworm
          python-version: "3.11"
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
      - run: uv sync --locked
      - run: uv run --frozen pytest -m smoke

  deb:
    name: DEB packages (armhf, arm64, amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the packages
        run: scripts/build_deb.sh --out dist
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: deb-packages
          path: dist/*.deb

  install:
    name: install.sh on a clean runner (install, update, uninstall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # install.sh clones a branch or tag: the tested commit as a local branch,
      # this checkout as the repository
      - name: Branch of the tested commit
        run: git switch -c ci-install
      - name: Install
        run: sudo ./install.sh --yes --no-hardware --repo "$GITHUB_WORKSPACE" --branch ci-install
      - name: Smoke test
        run: sudo scripts/smoke_install.sh
      - name: Update to a new commit of the branch
        run: |
          git -c user.name=CI -c user.email=ci@localhost commit -q --allow-empty -m "CI update test"
          sudo ./install.sh --update --yes --no-hardware
          test "$(git -C ~/ePiframe rev-parse HEAD)" = "$(git rev-parse HEAD)"
          systemctl is-active ePiframe
      - name: Smoke test after the update
        run: sudo scripts/smoke_install.sh
      - name: Uninstall
        run: |
          sudo ./install.sh --uninstall
          test ! -e /etc/systemd/system/ePiframe.service
          test ! -e /usr/local/bin/epiframe
          sudo test ! -e /etc/sudoers.d/epiframe
          test -d ~/ePiframe/.venv

  deb-install:
    name: DEB package on a clean runner (install, upgrade, purge)
    needs: deb
    runs-on: ubuntu-latest
    steps:
      # the smoke test script
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb-packages
          path: dist
      - name: Install the amd64 package
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ./dist/epiframe_*_amd64.deb
      - name: Smoke test
        run: sudo scripts/smoke_install.sh
      - name: Reinstall (postinst of an upgrade)
        run: |
          sudo systemctl start ePiframe
          sudo apt-get install -y --reinstall ./dist/epiframe_*_amd64.deb
          systemctl is-active ePiframe
      - name: Smoke test after the reinstallation
        run: sudo scripts/smoke_install.sh
      - name: Purge
        run: |
          sudo apt-get purge -y epiframe
          test ! -e /opt/epiframe
          test ! -e /etc/epiframe
          test ! -e /var/lib/epiframe
          test ! -e /var/cache/epiframe
          test ! -e /usr/lib/systemd/system/ePiframe.service
          test ! -e /usr/bin/epiframe
          sudo test ! -e /etc/sudoers.d/epiframe

  badges:
    name: Publish badges
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          name: reports
      - run: uv run --frozen python scripts/badges.py --junit junit.xml --coverage coverage.xml --out badges
      - name: Push badges to the "badges" branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --depth=1 origin badges
            git worktree add --detach badges-branch FETCH_HEAD
          else
            git worktree add --detach badges-branch
            git -C badges-branch checkout --orphan badges
            git -C badges-branch rm -rfq --ignore-unmatch .
          fi
          mkdir -p "badges-branch/$BRANCH"
          cp badges/*.svg "badges-branch/$BRANCH/"
          cd badges-branch
          git add -A
          if git diff --cached --quiet; then
            echo "Badges unchanged"
          else
            git commit -m "Update $BRANCH badges (${GITHUB_SHA::7})"
            git push origin HEAD:badges
          fi
